name: Build Client
on: [push]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build Project
        run: >
          msbuild "2021 Sources\Hyperion - Github\Hyperion-Client-main\Client.sln"
          /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v142
        shell: cmd

      # НОВЫЙ ШАГ: Покажем, где лежат exe-файлы
      - name: DEBUG: List all .exe files in project folder
        run: |
          echo "Searching for .exe files..."
          dir /s /b "2021 Sources\Hyperion - Github\Hyperion-Client-main\*.exe"
        shell: cmd

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Client-build
          # Ищем exe-файл рекурсивно в папке проекта
          path: "2021 Sources\Hyperion - Github\Hyperion-Client-main\**\*.exe"
